[package]
name = "bl808-pac"
version = "0.1.0"
edition = "2024"
authors = ["Bouffalo Lab Community"]
description = "Universal Wrapper PAC for Bouffalo Lab BL808 (M0/D0/LP cores)"

[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.dependencies]
critical-section = "1.2.0"
vcell = "0.1.3"
riscv = "0.16.1"
riscv-rt = "0.18.0"

[dependencies]
bl808-m0 = { path = "crates/bl808-m0", optional = true, default-features = false }
bl808-d0 = { path = "crates/bl808-d0", optional = true, default-features = false }
bl808-lp = { path = "crates/bl808-lp", optional = true, default-features = false }

[features]
default = ["critical-section"]

# Core Selection
m0 = ["dep:bl808-m0"]
d0 = ["dep:bl808-d0"]
lp = ["dep:bl808-lp"]

rt = ["bl808-m0?/rt", "bl808-d0?/rt", "bl808-lp?/rt"]
critical-section = ["bl808-m0?/critical-section", "bl808-d0?/critical-section", "bl808-lp?/critical-section"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
